<!DOCTYPE html>
<html>
<head>
<title>Reminders</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
padding:30px;
}

form{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid gray;
}

button{
background:#b22222;
color:white;
border:none;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#b22222;
color:white;
padding:15px;
}

td{
padding:15px;
border-bottom:1px solid #ddd;
text-align:center;
}

</style>

</head>

<body>

<h1>🔔 Reminders</h1>

<form method="POST" action="/add_reminder">

<input type="text" name="devotee" placeholder="భక్తుని పేరు">

<input type="text" name="work" placeholder="జపం / హోమం">

<input type="date" name="reminder_date">

<input type="time" name="reminder_time">

<button type="submit">

Reminder Add చేయండి

</button>

</form>

<table>

<tr>

<th>భక్తుడు</th>

<th>కార్యక్రమం</th>

<th>తేదీ</th>

<th>సమయం</th>

</tr>

{% for r in reminders %}

<tr>

<td>{{ r[1] }}</td>

<td>{{ r[2] }}</td>

<td>{{ r[3] }}</td>

<td>{{ r[4] }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
